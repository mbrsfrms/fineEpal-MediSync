plugins { id 'com.android.application' }

// google-services.json is specific to your Firebase project and is not shipped with the source.
// Without it the app still builds, but "Continue with Google" shows a setup message. See FIREBASE_SETUP.md.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.medisync.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.medisync.app'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }
}

dependencies {
    // Firebase Authentication (versions managed by the BoM)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'

    // Google Sign-In through Credential Manager (replaces the deprecated GoogleSignInClient)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
